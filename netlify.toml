[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the backend (Railway/Render) so src/lib/api.ts's
# relative "/api" base keeps working unchanged in production.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-URL.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes don't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
